name: Trading Alerts

on:
  workflow_dispatch:  # تشغيل يدوي فقط

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test Telegram Message
      run: |
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d "text=✅ <b>اختبار ناجح!</b>\n\nإذا وصلت هذه الرسالة، فالمفاتيح صحيحة والبوت جاهز للعمل." \
        -d "parse_mode=HTML"
